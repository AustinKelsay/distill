[workspace]
resolver = "3"
members = ["crates/distill-core", "crates/distill-cli", "crates/distill-mcp", "crates/distill-gui"]
default-members = ["crates/distill-core", "crates/distill-cli", "crates/distill-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
distill-core = { path = "crates/distill-core" }

# Rune patches these crates in its own workspace, and a dependency's [patch] does not apply to the
# workspace that depends on it, so apps that build Rune repeat them at the same pinned rev.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "b06a272542ff23be4690c9d5b6cd416c389f42bc" }
winit = { git = "https://github.com/anomalyco/rune", rev = "b06a272542ff23be4690c9d5b6cd416c389f42bc" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "b06a272542ff23be4690c9d5b6cd416c389f42bc" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "b06a272542ff23be4690c9d5b6cd416c389f42bc" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
