# Continuous PR enforcement for core Rust Library and desktop rebuild gates.
# Does not run package signing, real providers, full-scale benchmarks, or Windows jobs.

name: Distill rebuild CI

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/distill-desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out rebuild
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies for workspace crates
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Make provider detection tests hermetic
        run: |
          # The detection contract is about the configured data root. Use a
          # no-op Codex shim and only toolchain/system paths so the expected
          # status is stable without invoking a host-installed provider.
          provider_stub_bin="$RUNNER_TEMP/distill-provider-stubs"
          mkdir -p "$provider_stub_bin"
          printf '#!/bin/sh\nexit 0\n' > "$provider_stub_bin/codex"
          chmod +x "$provider_stub_bin/codex"
          cargo_bin="$(dirname "$(command -v cargo)")"
          rust_toolchain_bin="$(dirname "$(rustup which rustfmt)")"
          echo "PATH=${provider_stub_bin}:${cargo_bin}:${rust_toolchain_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy workspace with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test Library fault-injection contracts
        run: cargo test -p distill-library --features test-faults

      - name: Test Library Sync lease contracts
        run: cargo test -p distill-library --test library_ops_sync --features test-leases

  desktop-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out rebuild
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck desktop renderer
        run: npm run desktop:typecheck

      - name: Lint desktop renderer
        run: npm run desktop:lint

      - name: Check desktop renderer formatting
        run: npm run desktop:format

      - name: Test desktop renderer
        run: npm run desktop:test

      - name: Build desktop frontend
        run: npm run desktop:frontend:build
