name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The rclone adapter's test runs against `rclone serve s3` (rclone 1.65 or later; the
      # distribution's package is older).
      - run: |
          curl -fsSLO https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip
          unzip -q rclone-v1.76.0-linux-amd64.zip
          sudo install -m 755 rclone-v1.76.0-linux-amd64/rclone /usr/local/bin/rclone
          rm -rf rclone-v1.76.0-linux-amd64*
      - run: cargo fmt --all --check
      - run: cargo clippy -p distill-core -p distill-cli -p distill-mcp --all-targets -- -D warnings
      - run: cargo test -p distill-core -p distill-cli -p distill-mcp
      # Built on its own, so the shipped crates above never build distill-core's `eval` feature.
      - run: cargo clippy -p distill-eval --all-targets -- -D warnings
      - run: cargo test -p distill-eval

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libudev-dev pkg-config
      - run: cargo clippy -p distill-gui --all-targets -- -D warnings
      - run: cargo test -p distill-gui
