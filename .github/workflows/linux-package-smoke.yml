name: Distill Linux package smoke

on:
  pull_request:
    branches: [staging]
    paths:
      - "apps/distill-desktop/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - "docs/**"
      - ".github/workflows/linux-package-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out rebuild
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux/Tauri and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            dbus-x11 \
            at-spi2-core \
            gir1.2-atspi-2.0 \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            python3-gi \
            xdotool \
            xvfb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Debian and AppImage packages
        env:
          VITE_DISTILL_SMOKE_DOM_ACTIVATE: "1"
        run: npm run desktop:package:linux

      - name: Install the Debian package under test
        run: sudo apt-get install --yes ./target/release/bundle/deb/*.deb

      - name: Run installed-host packaged smoke
        env:
          GNOME_ACCESSIBILITY: "1"
          DISTILL_LINUX_BINARY: /usr/bin/distill-desktop
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run desktop:smoke:linux

      - name: Upload Linux package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distill-linux-packages
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
