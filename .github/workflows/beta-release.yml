name: Distill beta release

on:
  push:
    tags:
      - "v0.2.0-beta.1"
  workflow_dispatch:

permissions:
  contents: write

env:
  DISTILL_VERSION: 0.2.0-beta.1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies for workspace crates
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check beta metadata and docs
        run: |
          npm run release:check
          npm run check:docs

      - name: Run release gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          npm run desktop:typecheck
          npm run desktop:lint
          npm run desktop:format
          npm run desktop:test
          npm run desktop:frontend:build

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux/Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux release packages
        run: npm run desktop:package:linux

      - name: Upload Linux release packages
        uses: actions/upload-artifact@v4
        with:
          name: distill-${{ env.DISTILL_VERSION }}-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS release app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run --workspace @distill/desktop tauri -- build --bundles app

      - name: Archive macOS app
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/*.app "release-artifacts/Distill-${DISTILL_VERSION}-macos.zip"

      - name: Upload macOS release package
        uses: actions/upload-artifact@v4
        with:
          name: distill-${{ env.DISTILL_VERSION }}-macos
          path: release-artifacts/*.zip

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release installers
        run: npm run release:package:windows

      - name: Upload Windows release installers
        uses: actions/upload-artifact@v4
        with:
          name: distill-${{ env.DISTILL_VERSION }}-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: distill-*
          merge-multiple: true

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/**/*
