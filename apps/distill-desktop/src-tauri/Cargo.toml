# Distill desktop Tauri 2 host: thin async Library caller for the Fixture journey.

[package]
name = "distill-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Distill Tauri 2 desktop host"
default-run = "distill-desktop"

[lib]
name = "distill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "distill-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
distill-library = { path = "../../../crates/distill-library" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.5", features = [] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
